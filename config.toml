baseURL = "https://choiyaki.com"
languageCode = "ja"
title = "iPhoneと本と数学となんやかんやと"
# contentDir = "post"
paginate = 10
# disableKinds. = ["sitemap"]
theme = "mainroad"
publishDir = "docs"
rssLimit = 20
copyright = "2021 Atsushi Yoshida All rights reserved"
DefaultContentLanguage = "ja"
enableInlineShortcodes = true
footnoteReturnLinkContents = "^"
summaryLength = 300
hasCJKLanguage = true

hardLineBreak = true

[menu]

  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "/about/"
    weight = 10

[author]
	name = "choiyaki"

[taxonomies]
category = "categories"
tag = "tags"
[markup]
	[markup.goldmark]
		[markup.goldmark.renderer]
			unsafe = true
[related]
threshold = 80
includeNewer = true
toLower = false
[outputs]
home = [ "HTML", "AMP", "RSS" ]
page = [ "HTML", "AMP", "RSS" ] # if you want AMP enable.

[[related.indices]]
name = "keywords"
weight = 150
[[related.indices]]
name = "tags"
weight = 100
[[related.indices]]
name = "date"
weight = 10

[Params]
  mainSections = ["post", "posts"]
  description = "<your site description>"
  googleFontsLink = "https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100..900&display=swap"

[Params.style.vars]
  highlightColor = "#00A0A0" # Override highlight color (brightened from #008080 for link legibility)

  # Override font-family sets. Secondary font-family set responsible for pre, code, kbd, and samp tags font
  # Take care of different quotes OR escaping symbols in these params if necessary
  fontFamilyPrimary = "'Noto Sans JP', 'Open Sans', Helvetica, Arial, sans-serif"
  fontFamilySecondary = "SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace"

[Params.sidebar]
  single = "left" # Configure layout for single pages
  home = "left" # Configure layout for home page
  list = "left"  # Configure layout for list pages
  # Enable widgets in given order
  widgets = ["search", "recent", "categories", "taglist", "social", "languages"]
  # alternatively "ddg-search" can be used, to search via DuckDuckGo
  # widgets = ["ddg-search", "recent", "categories", "taglist", "social", "languages"]